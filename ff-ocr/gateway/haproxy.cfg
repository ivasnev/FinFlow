global
    maxconn 16
    log stdout format raw local0 warning

defaults
    mode http
    log global
    timeout connect 2s
    timeout client 100s
    timeout server 100s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout queue 2s

resolvers containers
    parse-resolv-conf
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 5s

frontend ocr
    bind :8086
    default_backend workers

backend workers
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 5s fall 3 rise 1
    server-template ocr 1-8 ff-ocr:8086 check resolvers containers resolve-prefer ipv4 init-addr none maxconn 1 maxqueue 1
