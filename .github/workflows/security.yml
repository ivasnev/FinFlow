name: Security and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [ff-auth, ff-files, ff-id, ff-split, ff-tvm, ff-common]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Check reproducible Files API generation
        if: matrix.module == 'ff-files'
        run: |
          make -C ff-files generate
          git diff --exit-code -- ff-files/pkg/api
      - name: Tests
        working-directory: ${{ matrix.module }}
        run: go test -count=1 -timeout=180s ./...
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan application and test dependencies
        working-directory: ${{ matrix.module }}
        run: govulncheck -test ./...
      - name: Scan Go tools
        shell: bash
        working-directory: ${{ matrix.module }}
        run: |
          tools="$(go list tool)"
          if [ -n "$tools" ]; then
            govulncheck $tools
          fi
      - name: Collect resolved application, test and tool dependencies
        run: python3 scripts/security/dependency_snapshot.py go --module ${{ matrix.module }} --output ${{ runner.temp }}/dependencies-${{ matrix.module }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: dependencies-${{ matrix.module }}
          path: ${{ runner.temp }}/dependencies-${{ matrix.module }}.json
          if-no-files-found: error
          retention-days: 3
  ocr:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            architecture: x86_64
          - os: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Update Python packaging tools
        run: python -m pip install --upgrade pip==26.2.2 wheel==0.48.0
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit complete OCR dependency resolution
        run: pip-audit --strict -r ff-ocr/requirements.txt -r ff-ocr/requirements-test.txt
      - name: Install OCR test dependencies
        run: python -m pip install -r ff-ocr/requirements.txt -r ff-ocr/requirements-test.txt
      - name: Check and audit the installed environment
        run: |
          python -m pip check
          python -m pip_audit --strict --local
      - name: Import the real Paddle runtime without downloading models
        run: |
          python - <<'PYTHON'
          import sys
          sys.path.insert(0, 'ff-ocr')
          import app
          app.prepare_runtime()
          from paddleocr import PaddleOCR
          print('PaddleOCR imports with the installed packaging tools')
          PYTHON
      - name: OCR tests, including graceful process termination
        run: python -m pytest ff-ocr/tests -q
      - name: Dependency collector regression tests
        run: python -m unittest discover -s scripts/security -p 'test_*.py'
      - name: Collect resolved production and test Python dependencies
        run: python scripts/security/dependency_snapshot.py pip --output ${{ runner.temp }}/dependencies-ocr-${{ matrix.architecture }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: dependencies-ocr-${{ matrix.architecture }}
          path: ${{ runner.temp }}/dependencies-ocr-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 3
  dependency-graph:
    # PR code never runs with a write token. Publish only artifacts of a successful main build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [go, ocr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: dependency-graph-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dependencies-*
          merge-multiple: true
          path: ${{ runner.temp }}/dependency-snapshots
      - name: Publish verified dependency snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/security/dependency_snapshot.py publish --directory ${{ runner.temp }}/dependency-snapshots
